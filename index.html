<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sky Nex &mdash; Repair Portal</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo-ring"><img src="logo.png" alt="Sky Nex"></div>
    <h1 class="login-title">SKY NEX</h1>
    <div class="login-brand-tag">Repair Portal</div>
    <div class="login-sub">TEAM ACCESS CONSOLE</div>

    <form id="loginForm" autocomplete="on">
      <div class="login-field">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" name="username" placeholder="Enter username" autocomplete="username" autocapitalize="off" autocorrect="off">
      </div>
      <div class="login-field">
        <label for="loginPassword">Password</label>
        <div class="login-pwd-wrap">
          <input type="password" id="loginPassword" name="password" placeholder="Enter password" autocomplete="current-password">
          <button type="button" class="login-pwd-toggle" id="loginPwdToggle" tabindex="-1" aria-label="Show password">
            <svg class="icon" viewBox="0 0 24 24" id="loginPwdEyeIcon"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="login-btn" id="loginBtn">Enter Console</button>
    </form>
    <div class="login-hint">Forgot your password? Contact your administrator.</div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <img src="logo.png" alt="Sky Nex">
      <div>
        <div class="brand-name">SKY NEX</div>
        <div class="brand-tag">Repair Portal</div>
      </div>
    </div>
    <div class="nav-scroll" id="navScroll"></div>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="user-avatar" id="sbUserAvatar">A</div>
        <div class="user-meta">
          <div class="n" id="sbUserName">Admin</div>
          <div class="r" id="sbUserRole">Administrator</div>
        </div>
        <button class="logout-btn" title="Toggle theme" id="themeToggleBtn" aria-label="Toggle light/dark theme">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.5 5.5 0 0 1-7.54-7.54A9 9 0 0 0 12 3z"/></svg>
        </button>
      </div>
      <button class="sidebar-logout-link" id="logoutBtn" aria-label="Log out">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Log Out</span>
      </button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar menu">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="page-heading">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub">Welcome back — here's what's happening today.</div>
      </div>
      <button class="icon-btn" title="Notifications" id="notifBtn" aria-label="Notifications">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot-badge" id="notifDot"></span>
      </button>
      <div class="topbar-avatar" id="topbarAvatar">A</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<div id="toast-wrap"></div>
<div class="printable" id="printArea"></div>

<script src="app.js"></script>
</body>
</html>
